<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Insup Night LP｜スマホ表示プレビュー</title>
  <style>
    :root { --bg: #e9eef7; --ink: #0a1f52; --blue: #1453e6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: radial-gradient(circle at 50% 0%, #fff 0, var(--bg) 60%);
      color: var(--ink);
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden;
    }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 14px 16px 10px; }
    .bar b { font-size: 14px; margin-right: 6px; }
    .bar button, .bar a {
      font: inherit; font-size: 13px; font-weight: 700;
      padding: 7px 14px; border-radius: 999px; border: 1.5px solid #c9d6ee;
      background: #fff; color: var(--ink); cursor: pointer; text-decoration: none;
    }
    .bar button.is-on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .stage { flex: 1; width: 100%; display: flex; align-items: flex-start; justify-content: center; min-height: 0; }
    .phone {
      position: relative;
      border-radius: 48px; padding: 34px 14px 14px;
      background: #111a2e;
      box-shadow: 0 30px 60px -20px rgba(10, 31, 82, .45), inset 0 0 0 2px #2a3550;
      transform-origin: top center;
    }
    .phone::before {
      content: ""; position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
      width: 72px; height: 9px; border-radius: 9px; background: #000; z-index: 2;
    }
    .phone iframe { display: block; border: 0; border-radius: 6px 6px 36px 36px; background: #fff; }
    .size { font-size: 12px; color: #5a6a88; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="bar">
    <b>スマホ表示プレビュー</b>
    <button type="button" data-w="375" data-h="667">iPhone SE</button>
    <button type="button" data-w="393" data-h="852" class="is-on">iPhone 15</button>
    <button type="button" data-w="430" data-h="932">iPhone 15 Pro Max</button>
    <button type="button" data-w="412" data-h="915">Android</button>
    <button type="button" id="reload">再読み込み</button>
    <a href="index.html" target="_blank">PC表示で開く</a>
  </div>
  <div class="stage">
    <div class="phone" id="phone">
      <iframe id="frame" src="index.html" title="Insup Night LP スマホ表示"></iframe>
    </div>
  </div>
  <p class="size" id="size"></p>

  <script>
    (function () {
      var phone = document.getElementById('phone');
      var frame = document.getElementById('frame');
      var sizeEl = document.getElementById('size');
      var w = 393, h = 852;
      function fit() {
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
        var avail = window.innerHeight - 110;
        var scale = Math.min(1, avail / (h + 48));
        phone.style.transform = 'scale(' + scale + ')';
        phone.parentNode.style.height = ((h + 48) * scale) + 'px';
        sizeEl.textContent = w + ' × ' + h + 'px' + (scale < 1 ? '（画面に合わせて ' + Math.round(scale * 100) + '% で表示中）' : '');
      }
      Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-w]').forEach(function (x) { x.classList.remove('is-on'); });
          b.classList.add('is-on');
          w = +b.dataset.w; h = +b.dataset.h; fit();
        });
      });
      document.getElementById('reload').addEventListener('click', function () { frame.src = frame.src; });
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
